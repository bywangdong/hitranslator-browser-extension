name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate tag version
        shell: bash
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION" >&2
            exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Test public release scope
        run: pnpm test
        env:
          SKIP_FREE_API: "true"

      - name: Type check
        run: pnpm type-check

      - name: Build binary and corresponding source archives
        run: pnpm zip

      - name: Create checksums
        shell: bash
        run: |
          sha256sum \
            "dist/HiTranslator-Web-${VERSION}-chrome.zip" \
            "dist/HiTranslator-Web-${VERSION}-sources.zip" \
            > dist/SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/HiTranslator-Web-${VERSION}-chrome.zip" \
            "dist/HiTranslator-Web-${VERSION}-sources.zip" \
            dist/SHA256SUMS.txt \
            --generate-notes \
            --title "HiTranslator Browser Extension ${VERSION}"
